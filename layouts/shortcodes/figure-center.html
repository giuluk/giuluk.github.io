<!--
  Shortcode Hugo per visualizzare un'immagine centrata nella pagina,
  con testo alternativo e didascalia opzionale.

  Utilizzo:
  figure-center src="/img/moebius.png"
  alt="Nastro di Möbius"
  caption="Nastro di Möbius"
-->

<figure style="display: flex; flex-direction: column; align-items: center; text-align: center;">
  <img src="{{ .Get "src" }}" alt="{{ .Get "alt" }}">
  {{ with .Get "caption" }}
    <figcaption>{{ . | markdownify }}</figcaption>
  {{ end }}
</figure>
